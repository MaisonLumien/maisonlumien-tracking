services:
  - type: web
    name: maisonlumien-tracking
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python webhooks/server.py
    envVars:
      - key: DB_SERVER
        value: your_db_server
      - key: DB_NAME
        value: MaisonLumien_Marketing
      - key: DB_USER
        value: your_db_user
      - key: DB_PASSWORD
        value: your_db_password